name: sync wallpapers

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC daily
  workflow_dispatch:           # manual "Run workflow" button
    inputs:
      max_new:
        description: "Max wallpapers to add this run"
        default: "40"
      max_items:
        description: "Archive size cap (older entries are pruned)"
        default: "4000"

permissions:
  contents: write              # the job commits the manifest back to the repo

# Images go to R2, so the repository only ever carries code and a manifest.
# The "R2 configured?" preflight step below fails the job outright if these
# are missing, rather than letting the pipeline silently fall back to local
# storage and repoint the live manifest at files that don't exist.
env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}

concurrency:
  # Shared with maintain.yml. Both mutate the manifest and delete from or write
  # to R2; two of them interleaving would have one overwrite the other's
  # manifest and leave orphaned or missing objects behind.
  group: archive-write
  cancel-in-progress: false    # never interrupt a run mid-commit

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: R2 configured?
        run: |
          missing=""
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing — without all five,"\
                 "storage falls back to committing images into the repo and"\
                 "the manifest repoints at URLs that don't exist. Add them"\
                 "under Settings -> Secrets and variables -> Actions before"\
                 "this workflow can run."
            exit 1
          fi

      - name: Pull new wallpapers (Danbooru)
        env:
          MAX_NEW: ${{ inputs.max_new || '40' }}
        run: |
          case "$MAX_NEW" in
            ''|*[!0-9]*) echo "max_new must be an integer" >&2; exit 1 ;;
          esac
          python scripts/sync_danbooru.py --max-new "$MAX_NEW"

      - name: Prune to the free-tier ceiling
        env:
          MAX_ITEMS: ${{ inputs.max_items || '4000' }}
        run: |
          case "$MAX_ITEMS" in
            ''|*[!0-9]*) echo "max_items must be an integer" >&2; exit 1 ;;
          esac
          # 8 GiB keeps storage under R2's 10 GB free tier with headroom
          python scripts/prune.py --max-items "$MAX_ITEMS" --max-bytes 8589934592

      - name: Rebuild index, sitemap and structured data
        run: python scripts/build_site.py

      - name: Verify the build is servable
        run: |
          python - <<'PY'
          import json, pathlib, re, sys

          root = pathlib.Path(".")
          data = json.loads((root / "data/wallpapers.json").read_text())
          items = data["items"]

          if not data.get("cdn"):
              sys.exit("manifest has no cdn set — R2 preflight should have "
                        "caught this; refusing to publish a broken index")

          doc = (root / "index.html").read_text()
          for block in re.findall(r'<script type="application/ld\+json"[^>]*>(.*?)</script>',
                                  doc, re.S):
              json.loads(block.replace('<\\/', '</'))     # raises on malformed JSON-LD

          # Cloudflare Pages refuses a deployment above 20,000 files
          files = sum(1 for p in root.rglob("*")
                      if p.is_file() and ".git" not in p.parts)
          if files > 19_000:
              sys.exit(f"{files} files — approaching the Pages 20,000 limit")

          print(f"ok: {len(items)} items, {files} files")
          PY

      - name: Commit
        run: |
          git config user.name  "wallpaper-bot"
          git config user.email "actions@users.noreply.github.com"
          # `w` holds the generated character pages. Without it here they are
          # rebuilt on every run and thrown away, so the deployed site keeps
          # serving whatever set of characters happened to exist at the last
          # manual build while the sitemap advertises the current one.
          git add -A data assets index.html sitemap.xml robots.txt llms.txt _headers w
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi

          before=$(git show HEAD:data/wallpapers.json 2>/dev/null | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('items',[])))" 2>/dev/null || echo 0)
          after=$(python3 -c "import json; print(len(json.load(open('data/wallpapers.json')).get('items',[])))")
          git commit -m "sync: ${after} wallpapers (was ${before})"

          # checkout is shallow, so a plain `pull --rebase` can fail for want of
          # a merge base — and it would fail precisely when the remote has moved,
          # which is the only case it exists to handle. Try the push first and
          # only deepen history on the retry path, where the cost is rare.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "push rejected — deepening history and rebasing onto the remote"
            git fetch --deepen=50 origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Push notification rather than waiting to be recrawled. Only fires when
      # the manifest actually moved, so a quiet day sends nothing.
      - name: Tell search engines what changed
        run: python scripts/indexnow.py
