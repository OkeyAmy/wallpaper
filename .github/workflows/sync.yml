name: sync wallpapers

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC daily
  workflow_dispatch:           # manual "Run workflow" button
    inputs:
      max_new:
        description: "Max wallpapers to add this run"
        default: "40"
      max_items:
        description: "Archive size cap (older entries are pruned)"
        default: "4000"

permissions:
  contents: write              # the job commits the manifest back to the repo

# Images go to R2, so the repository only ever carries code and a manifest.
# Without these the pipeline falls back to committing images into the repo,
# which works but makes the repo grow without bound.
env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}

concurrency:
  group: sync
  cancel-in-progress: false    # never interrupt a run mid-commit

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Pull new wallpapers
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          # via env, never interpolated into the shell line: a workflow_dispatch
          # input is attacker-controlled text as far as the runner is concerned
          MAX_NEW: ${{ inputs.max_new || '40' }}
        run: |
          case "$MAX_NEW" in
            ''|*[!0-9]*) echo "max_new must be an integer" >&2; exit 1 ;;
          esac
          if [ -z "$REDDIT_CLIENT_ID" ]; then
            echo "::warning::No Reddit credentials configured — the API blocks"\
                 "anonymous requests from CI, so this run will find nothing."
          fi
          python scripts/sync_reddit.py --max-new "$MAX_NEW"

      - name: Prune to the free-tier ceiling
        env:
          MAX_ITEMS: ${{ inputs.max_items || '4000' }}
        run: |
          case "$MAX_ITEMS" in
            ''|*[!0-9]*) echo "max_items must be an integer" >&2; exit 1 ;;
          esac
          # 8 GiB keeps storage under R2's 10 GB free tier with headroom
          python scripts/prune.py --max-items "$MAX_ITEMS" --max-bytes 8589934592

      - name: Rebuild index, sitemap and structured data
        run: python scripts/build_site.py

      - name: Verify the build is servable
        run: |
          python - <<'PY'
          import json, pathlib, re, sys

          root = pathlib.Path(".")
          data = json.loads((root / "data/wallpapers.json").read_text())
          items = data["items"]

          # in R2 mode the images are not on disk, so only check local mode
          if not data.get("cdn"):
              missing = [i["id"] for i in items
                         if not (root / i["file"]).exists()
                         or not (root / i["thumb"]).exists()]
              if missing:
                  sys.exit(f"manifest references {len(missing)} missing files: {missing[:5]}")

          doc = (root / "index.html").read_text()
          for block in re.findall(r'<script type="application/ld\+json"[^>]*>(.*?)</script>',
                                  doc, re.S):
              json.loads(block.replace('<\\/', '</'))     # raises on malformed JSON-LD

          # Cloudflare Pages refuses a deployment above 20,000 files
          files = sum(1 for p in root.rglob("*")
                      if p.is_file() and ".git" not in p.parts)
          if files > 19_000:
              sys.exit(f"{files} files — approaching the Pages 20,000 limit")

          print(f"ok: {len(items)} items, {files} files")
          PY

      - name: Commit
        run: |
          git config user.name  "wallpaper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A wallpapers data assets index.html sitemap.xml robots.txt llms.txt
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          count=$(git diff --staged --name-only --diff-filter=A -- wallpapers/thumbs | wc -l)
          git commit -m "sync: ${count} new wallpapers"

          # checkout is shallow, so a plain `pull --rebase` can fail for want of
          # a merge base — and it would fail precisely when the remote has moved,
          # which is the only case it exists to handle. Try the push first and
          # only deepen history on the retry path, where the cost is rare.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "push rejected — deepening history and rebasing onto the remote"
            git fetch --deepen=50 origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
